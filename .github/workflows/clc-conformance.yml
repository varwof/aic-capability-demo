name: clc-conformance

# CLC-v1 语义一致性：本仓（Python + TypeScript 独立实现）必须与 capability 仓的
# 向量逐条一致（verdict + 规范码 reason 双断言）。与 register 仓的 Go 实现
# 互为一对照。依赖：向量在独立仓 varwof/capability，本 workflow 会浅克隆到 ../capability。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest
    env:
      CLC_CAPABILITY_DIR: ../capability
    steps:
      - uses: actions/checkout@v4

      - name: Fetch CLC capability corpus
        run: git clone --depth 1 https://github.com/varwof/capability.git ../capability

      - name: Fetch Go reference implementation
        run: git clone --depth 1 https://github.com/varwof/register.git ../register

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version-file: ../register/go.mod
          cache: false

      - name: Install TypeScript dev dependencies
        run: npm ci --prefix ts

      - name: Emit Python canonical outputs
        run: python3 extension-parity-run.py > /tmp/clc-parity-python.json

      - name: Emit TypeScript canonical outputs
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types ts/extension-parity-run.ts > /tmp/clc-parity-typescript.json

      - name: Emit Go canonical outputs
        run: go -C ../register run ./cmd/extension-parity-run > /tmp/clc-parity-go.json

      - name: Compare Python and TypeScript canonical outputs
        run: diff -u /tmp/clc-parity-python.json /tmp/clc-parity-typescript.json

      - name: Compare Python and Go canonical outputs
        run: diff -u /tmp/clc-parity-python.json /tmp/clc-parity-go.json

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch CLC-v1 vectors (capability repo)
        run: git clone --depth 1 https://github.com/varwof/capability.git ../capability

      - name: Syntax check
        run: python3 -m py_compile clc_semantics.py vectors-run.py contains-vectors-run.py contain-property-run.py param-bounds-vectors-run.py param-bounds-meet-vectors-run.py param-bounds-meet-property-run.py resolve-vectors-run.py constraint-union-vectors-run.py authorize-chain-vectors-run.py evidence_semantics.py scheme_decl.py ocmp.py symmetry-vectors-run.py quantity-vectors-run.py scheme-declaration-vectors-run.py offline-vectors-run.py profile-declarations-run.py extended_test.py

      - name: Extended API positive/negative checks (Python)
        run: python3 extended_test.py

      - name: Symmetry corpus (authorization + evidence, Python)
        env:
          CLC_CAPABILITY_DIR: ../capability
        run: python3 symmetry-vectors-run.py

      - name: Declared domains + quantity corpus (Python)
        env:
          CLC_CAPABILITY_DIR: ../capability
        run: python3 quantity-vectors-run.py

      - name: Scheme declaration corpus (Python)
        env:
          CLC_CAPABILITY_DIR: ../capability
        run: python3 scheme-declaration-vectors-run.py

      - name: OCMP offline profile (Python)
        env:
          CLC_CAPABILITY_DIR: ../capability
        run: python3 offline-vectors-run.py

      - name: Profile declarations 6/7 (Python)
        env:
          CLC_CAPABILITY_DIR: ../capability
        run: python3 profile-declarations-run.py

      - name: CLC-v1 vectors (verdict + reason)
        env:
          CLC_VECTORS: ../capability/data/_vectors/clc-v1/vectors.json
        run: python3 vectors-run.py

      - name: P11 property (composition narrows only)
        env:
          CLC_PROPERTY_CASES: ../capability/data/_vectors/clc-v1/property-cases.json
        run: python3 property_test.py

      - name: CLC-D containment vectors (contains + reason)
        env:
          CLC_D_VECTORS: ../capability/data/_vectors/clc-d/containment-vectors.json
        run: python3 contains-vectors-run.py

      - name: CLC-D forward-closure property
        env:
          CLC_D_PROPERTY_CASES: ../capability/data/_vectors/clc-d/containment-property-cases.json
        run: python3 contain-property-run.py

      - name: CLC-1.10 extended parameter bounds (verdict + reason)
        env:
          CLC_PARAM_BOUNDS_VECTORS: ../capability/data/_vectors/clc-v1/param-bounds-vectors.json
        run: python3 param-bounds-vectors-run.py

      - name: CLC-1.11 Resolve (verdict + reason + obligations)
        env:
          CLC_RESOLVE_VECTORS: ../capability/data/_vectors/clc-v1/resolve-vectors.json
        run: python3 resolve-vectors-run.py

      - name: CLC-1.12 ConstraintUnion (normalized union)
        env:
          CLC_CONSTRAINT_UNION_VECTORS: ../capability/data/_vectors/clc-v1/constraint-union-vectors.json
        run: python3 constraint-union-vectors-run.py

      - name: CLC-1.13 AuthorizeWithChain (fused chain check)
        env:
          CLC_AUTHORIZE_CHAIN_VECTORS: ../capability/data/_vectors/clc-d/authorize-chain-vectors.json
        run: python3 authorize-chain-vectors-run.py

      - name: CLC-1.14 BoundMeet (param_bounds intersection)
        env:
          CLC_PARAM_BOUNDS_MEET_VECTORS: ../capability/data/_vectors/clc-v1/param-bounds-meet-vectors.json
        run: python3 param-bounds-meet-vectors-run.py

      - name: CLC-1.15 BoundMeet property (the meet narrows only)
        env:
          CLC_PARAM_BOUNDS_MEET_PROPERTY_CASES: ../capability/data/_vectors/clc-v1/param-bounds-meet-property-cases.json
        run: python3 param-bounds-meet-property-run.py

      - name: CLC-1.15 §6.5 enum type-sensitive equality
        env:
          CLC_PARAM_BOUNDS_VECTORS: ../capability/data/_vectors/clc-v1/param-bounds-equality-vectors.json
        run: python3 param-bounds-vectors-run.py

      - name: CLC-1.15 §7.1 ConstraintUnion collation (UTF-8 byte order)
        env:
          CLC_CONSTRAINT_UNION_VECTORS: ../capability/data/_vectors/clc-v1/constraint-union-collation-vectors.json
        run: python3 constraint-union-vectors-run.py

      - name: Python branch coverage (80% minimum)
        run: |
          python3 -m venv /tmp/clc-python-coverage-venv
          /tmp/clc-python-coverage-venv/bin/pip install --quiet coverage
          COVERAGE=/tmp/clc-python-coverage-venv/bin/coverage bash coverage-run.sh

      - name: Upload Python coverage
        uses: actions/upload-artifact@v4
        with:
          name: clc-python-coverage
          path: |
            /tmp/clc-python-coverage.json
            /tmp/clc-python-coverage.xml

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch CLC-v1 vectors (capability repo)
        run: git clone --depth 1 https://github.com/varwof/capability.git ../capability

      - name: Install TypeScript dev dependencies
        run: npm ci --prefix ts

      - name: TypeScript strict typecheck
        run: npm --prefix ts run typecheck

      - name: Extended API positive/negative checks (TS)
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types ts/extended_test.ts

      - name: Symmetry corpus (authorization + evidence, TS)
        env:
          CLC_CAPABILITY_DIR: ../capability
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types ts/symmetry-vectors-run.ts

      - name: Declared domains + quantity corpus (TS)
        env:
          CLC_CAPABILITY_DIR: ../capability
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types ts/quantity-vectors-run.ts

      - name: Scheme declaration corpus (TS)
        env:
          CLC_CAPABILITY_DIR: ../capability
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types ts/scheme-declaration-vectors-run.ts

      - name: OCMP offline profile (TS)
        env:
          CLC_CAPABILITY_DIR: ../capability
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types ts/offline-vectors-run.ts

      - name: Profile declarations 6/7 (TS)
        env:
          CLC_CAPABILITY_DIR: ../capability
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types ts/profile-declarations-run.ts

      - name: CLC-v1 vectors (verdict + reason, TS)
        env:
          CLC_VECTORS: ../capability/data/_vectors/clc-v1/vectors.json
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types ts/vectors-run.ts

      - name: P11 property (composition narrows only, TS)
        env:
          CLC_PROPERTY_CASES: ../capability/data/_vectors/clc-v1/property-cases.json
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types ts/property.ts

      - name: CLC-D containment vectors (contains + reason, TS)
        env:
          CLC_D_VECTORS: ../capability/data/_vectors/clc-d/containment-vectors.json
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types ts/contains-vectors-run.ts

      - name: CLC-D forward-closure property (TS)
        env:
          CLC_D_PROPERTY_CASES: ../capability/data/_vectors/clc-d/containment-property-cases.json
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types ts/contain-property.ts

      - name: CLC-1.10 extended parameter bounds (verdict + reason, TS)
        env:
          CLC_PARAM_BOUNDS_VECTORS: ../capability/data/_vectors/clc-v1/param-bounds-vectors.json
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types ts/param-bounds-vectors-run.ts

      - name: CLC-1.11 Resolve (verdict + reason + obligations, TS)
        env:
          CLC_RESOLVE_VECTORS: ../capability/data/_vectors/clc-v1/resolve-vectors.json
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types ts/resolve-vectors-run.ts

      - name: CLC-1.12 ConstraintUnion (normalized union, TS)
        env:
          CLC_CONSTRAINT_UNION_VECTORS: ../capability/data/_vectors/clc-v1/constraint-union-vectors.json
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types ts/constraint-union-vectors-run.ts

      - name: CLC-1.13 AuthorizeWithChain (fused chain check, TS)
        env:
          CLC_AUTHORIZE_CHAIN_VECTORS: ../capability/data/_vectors/clc-d/authorize-chain-vectors.json
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types ts/authorize-chain-vectors-run.ts

      - name: CLC-1.14 BoundMeet (param_bounds intersection, TS)
        env:
          CLC_PARAM_BOUNDS_MEET_VECTORS: ../capability/data/_vectors/clc-v1/param-bounds-meet-vectors.json
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types ts/param-bounds-meet-vectors-run.ts

      - name: CLC-1.15 BoundMeet property (the meet narrows only, TS)
        env:
          CLC_PARAM_BOUNDS_MEET_PROPERTY_CASES: ../capability/data/_vectors/clc-v1/param-bounds-meet-property-cases.json
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types ts/param-bounds-meet-property.ts

      - name: CLC-1.15 §6.5 enum type-sensitive equality (TS)
        env:
          CLC_PARAM_BOUNDS_VECTORS: ../capability/data/_vectors/clc-v1/param-bounds-equality-vectors.json
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types ts/param-bounds-vectors-run.ts

      - name: CLC-1.15 §7.1 ConstraintUnion collation (UTF-8 byte order, TS)
        env:
          CLC_CONSTRAINT_UNION_VECTORS: ../capability/data/_vectors/clc-v1/constraint-union-collation-vectors.json
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types ts/constraint-union-vectors-run.ts

      - name: TypeScript coverage gates
        env:
          NODE_V8_COVERAGE: /tmp/clc-typescript-v8-coverage
        run: bash ts/coverage-test.sh

      - name: Upload TypeScript V8 coverage
        uses: actions/upload-artifact@v4
        with:
          name: clc-typescript-coverage
          path: /tmp/clc-typescript-v8-coverage
